name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Trivy's version check calls check.trivy.dev, which no longer resolves.
  TRIVY_SKIP_VERSION_CHECK: "true"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, Clippy and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --bins --locked

  audit:
    name: Cargo audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  # Every integration test against a real MySQL or MariaDB server, a real
  # PostgreSQL server and a real S3-compatible store: a backup restored into
  # a fresh database and compared by checksum, multi-database keys, `*`,
  # the engine warning, and the failure paths (the dump failing mid-stream,
  # a stall hitting DUMP_TIMEOUT, SIGTERM, an S3 error), each asserting that
  # no object and no multipart upload is left behind.
  integration:
    name: Integration (${{ matrix.db }}, ${{ matrix.pg }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: "mysql:8.4", pg: "postgres:14" }
          - { db: "mariadb:11.4", pg: "postgres:17" }
          - { db: "mariadb:11.8", pg: "postgres:18" }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
      pg:
        image: ${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: rootpw
        ports: ["5432:5432"]
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: testkey
          ROOT_SECRET_KEY: testsecret123
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ["7070:7070"]
    env:
      TEST_REQUIRE_INTEGRATION: "1"
      TEST_S3_ENDPOINT: http://127.0.0.1:7070
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: rootpw
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: rootpw
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pg_dump must be at least as new as the newest server in the matrix
      # (18); the version line shows what apt installed.
      - name: Install the MariaDB and PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client postgresql-client
          pg_dump --version

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo test --test integration --locked --no-run

      - name: Wait for the database and S3
        run: |
          for _ in $(seq 1 60); do
            if MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1 \
                && PGPASSWORD=rootpw psql -h 127.0.0.1 -U postgres -c 'SELECT 1' >/dev/null 2>&1 \
                && curl -s -o /dev/null http://127.0.0.1:7070; then
              exit 0
            fi
            sleep 2
          done
          MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1'
          exit 1

      - name: Integration tests
        run: cargo test --test integration --locked -- --test-threads=4

      # The `*` tests back up every database on the server, so they run on
      # their own, after the tests that create and drop databases.
      - name: Integration tests for `*`
        run: cargo test --test integration --locked -- --ignored --test-threads=1

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not through setup-trivy: get.trivy.dev stopped resolving on 2026-11-03
      # (aquasecurity/setup-trivy#42). This fetches the GitHub release instead.
      - name: Install Trivy
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: trivy@0.70.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  # Builds the real image, scans it, then runs the database integration tests
  # through it, so the shipped binary, its database clients and its user are what
  # get tested.
  image:
    name: Image scan and end-to-end tests
    runs-on: ubuntu-26.04
    services:
      db:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
      pg:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: rootpw
        ports: ["5432:5432"]
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: testkey
          ROOT_SECRET_KEY: testsecret123
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ["7070:7070"]
    env:
      TEST_REQUIRE_INTEGRATION: "1"
      TEST_IMAGE: db-s3-backup:scan
      TEST_S3_ENDPOINT: http://127.0.0.1:7070
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: rootpw
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: rootpw
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: db-s3-backup:scan

      # Not through setup-trivy: get.trivy.dev stopped resolving on 2026-11-03
      # (aquasecurity/setup-trivy#42). This fetches the GitHub release instead.
      - name: Install Trivy
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: trivy@0.70.0

      # ignore-unfixed: only fail on CVEs that have an upstream fix available
      # (the actionable set). Without it, an unfixable upstream CVE would block
      # every build until the dependency cuts a release. The binary is built
      # with cargo-auditable, so this covers its Rust crates as well as Alpine.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: db-s3-backup:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # pg_dump must be at least as new as the newest server in the matrix
      # (18); the version line shows what apt installed.
      - name: Install the MariaDB and PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client postgresql-client
          pg_dump --version

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the test harness
        run: cargo test --test integration --locked --no-run

      - name: Wait for the database and S3
        run: |
          for _ in $(seq 1 60); do
            if MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1 \
                && PGPASSWORD=rootpw psql -h 127.0.0.1 -U postgres -c 'SELECT 1' >/dev/null 2>&1 \
                && curl -s -o /dev/null http://127.0.0.1:7070; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: End-to-end tests through the image
        run: cargo test --test integration --locked -- --test-threads=4

      # The `*` tests back up every database on the server, so they run on
      # their own, after the tests that create and drop databases.
      - name: Integration tests for `*`
        run: cargo test --test integration --locked -- --ignored --test-threads=1

  # The release builds arm64 by cross-compiling (see the Dockerfile); this
  # catches a broken cross build before a tag does. QEMU only runs the runtime
  # stage's apk commands.
  image-arm64:
    name: arm64 image build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config auto --error
